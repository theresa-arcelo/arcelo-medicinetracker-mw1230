<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Medication - MedTracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>MedTracker</h1>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="records.html">Records</a>
        <a href="add.html">Add</a>
        <a href="edit.html" class="active">Edit</a>
      </nav>
    </header>

    <h2>Edit Medication</h2>

    <div class="notice" id="notice">
      Loading medication...
    </div>

    <form onsubmit="updateMedication(); return false;">
      <input type="hidden" id="medId">

      <div class="form-group">
        <label>Medication Name</label>
        <input type="text" id="name">
      </div>

      <div class="form-group">
        <label>Dosage (mg)</label>
        <input type="number" id="dosage">
      </div>

      <div class="form-group">
        <label>Frequency (per day)</label>
        <input type="number" id="frequency">
      </div>

      <div class="form-group">
        <label>Duration (days)</label>
        <input type="number" id="duration" min="1">
      </div>

      <div class="form-group">
        <label>Start Date</label>
        <input type="date" id="start_date">
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="category">
          <option value="Painkiller">Painkiller</option>
          <option value="Antibiotic">Antibiotic</option>
          <option value="Vitamin">Vitamin</option>
          <option value="Allergy">Allergy</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <button type="submit">Update Medication</button>
      <a href="records.html" class="btn btn-secondary">Cancel</a>
    </form>
  </div>

  <script src="script.js"></script>
  <script>
    loadMedicationForEdit();
  </script>
</body>
</html>
